<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive course demos for WPI CS 4343.">
  <title>WPI CS 4343 · Demos</title>
  <script src="course-theme.js"></script>
  <link rel="stylesheet" href="course-theme.css">
  <style>
    :root {
      scrollbar-color: var(--muted) var(--background);
      scrollbar-gutter: stable;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--background); color: var(--text); font: 16px/1.6 "Segoe UI", Arial, sans-serif; }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .skip { position: absolute; top: -100px; left: 16px; padding: 8px 16px; background: var(--surface); z-index: 1; }
    .skip:focus { top: 8px; }
    nav { flex: none; background: var(--surface); border-top: 4px solid var(--accent); border-bottom: 1px solid var(--border); }
    .navbar { max-width: 1280px; margin: auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
    .navbar [data-theme-toggle] { margin-left: auto; }
    .brand { color: var(--text); font-size: 20px; font-weight: 700; text-decoration: none; }
    .brand span { color: var(--accent); }
    .nav-links { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0; padding: 0; }
    .nav-links a { display: inline-block; padding-block: 6px; font-size: 14px; }
    .nav-links a[aria-current="page"] { font-weight: 700; text-decoration-thickness: 3px; }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .frame-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding: 6px 24px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .frame-toolbar h1 { margin: 0; font-size: 13px; font-weight: 600; }
    .frame-wrap { flex: 1; min-height: 0; position: relative; background: var(--surface); }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (max-width: 600px) {
      .navbar { padding-inline: 18px; gap: 8px; }
      .nav-links { width: 100%; gap: 4px 18px; order: 1; }
      .frame-toolbar { padding-inline: 18px; }
    }
    @media (forced-colors: active) { :root { scrollbar-color: auto; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <nav aria-label="Course demos">
    <div class="navbar">
      <a class="brand" href="index.html"><span>WPI</span> CS 4343</a>
      <ul class="nav-links">
        <li><a href="2-learn_xor.html" target="demo-frame" data-demo="xor" aria-current="page">Learning XOR</a></li>
        <li><a href="3-optimizer_viz.html" target="demo-frame" data-demo="optimization">Optimization</a></li>
        <li><a href="4-conv_calculation_vis.html" target="demo-frame" data-demo="conv-calculation">Convolution calculation</a></li>
        <li><a href="4-conv_operation_demo.html" target="demo-frame" data-demo="conv-images">Convolution on images</a></li>
      </ul>
      <button type="button" data-theme-toggle>Dark mode</button>
    </div>
  </nav>
  <main id="main">
    <div class="frame-toolbar">
      <h1 id="demo-title">Learning XOR</h1>
      <a id="open-demo" href="2-learn_xor.html" target="_blank" rel="noopener">Open demo in new tab ↗</a>
    </div>
    <div class="frame-wrap">
      <iframe id="demo-frame" name="demo-frame" src="2-learn_xor.html" title="Learning XOR demo"></iframe>
    </div>
  </main>
  <script>
    (() => {
      const links = [...document.querySelectorAll('[data-demo]')];
      const title = document.getElementById('demo-title');
      const openDemo = document.getElementById('open-demo');
      let frame = document.getElementById('demo-frame');
      let currentDemo = null;

      function updateThemeLinks() {
        for (const link of [...links, document.querySelector('.brand')]) {
          const url = new URL(link.href);
          url.searchParams.set('theme', CourseTheme.get());
          link.href = url.href;
        }
        openDemo.href = (links.find(link => link.dataset.demo === currentDemo) || links[0]).href;
      }

      function syncFrameTheme() {
        try {
          frame.contentWindow.CourseTheme?.set(CourseTheme.get(), { persist: false, notifyParent: false });
        } catch {}
      }

      function showDemo() {
        updateThemeLinks();
        const link = links.find(link => '#' + link.dataset.demo === location.hash) || links[0];
        if (currentDemo === link.dataset.demo) return;
        currentDemo = link.dataset.demo;
        for (const item of links) {
          if (item === link) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        }
        title.textContent = link.textContent;
        openDemo.href = link.href;
        document.title = `WPI CS 4343 · ${link.textContent}`;

        // A fresh frame loads its initial document without adding a second
        // navigation entry to the browser's Back/Forward history.
        if (frame.getAttribute('src') !== link.getAttribute('href')) {
          const nextFrame = frame.cloneNode(false);
          nextFrame.src = link.getAttribute('href');
          nextFrame.title = `${link.textContent} demo`;
          nextFrame.addEventListener('load', syncFrameTheme);
          frame.replaceWith(nextFrame);
          frame = nextFrame;
        }
      }

      for (const link of links) {
        link.addEventListener('click', event => {
          if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          const hash = '#' + link.dataset.demo;
          if (location.hash !== hash) history.pushState(null, '', hash);
          showDemo();
        });
      }
      window.addEventListener('popstate', showDemo);
      window.addEventListener('hashchange', showDemo);
      window.addEventListener('course-theme-change', () => {
        updateThemeLinks();
        syncFrameTheme();
      });
      frame.addEventListener('load', syncFrameTheme);
      showDemo();
    })();
  </script>
</body>
</html>
